<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in - StudyCollab</title>
    <script>
      (function () {
        var base = document.createElement('base');
        base.href = location.pathname.includes('/public/') ? '/public/' : '/';
        document.head.appendChild(base);
      })();
    </script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <div class="page-loader" id="pageLoader">
      <div class="spinner"></div>
    </div>
    <script>
      (function () {
        var done = false;
        function dismiss() {
          if (done) return;
          done = true;
          var el = document.getElementById('pageLoader');
          if (!el) return;
          el.classList.add('hidden');
          setTimeout(function () {
            try {
              el.remove();
            } catch (e) {}
          }, 450);
        }
        document.addEventListener('DOMContentLoaded', dismiss, { once: true });
        setTimeout(dismiss, 500);
      })();
    </script>
    <div class="bg-orbs"></div>
    <div class="auth-shell">
      <div class="auth-panel">
        <h2>Welcome back</h2>
        <p>Log in to your study workspace.</p>
        <form class="auth-form" id="loginForm">
          <div class="input-group">
            <input class="input" type="email" name="email" placeholder="Email" required />
            <span class="input-help">Use your school or personal email.</span>
          </div>
          <div class="input-group">
            <input
              class="input"
              id="loginPassword"
              type="password"
              name="password"
              placeholder="Password"
              required
            />
            <button class="input-addon" type="button" data-toggle-password="loginPassword">
              Show
            </button>
            <span class="input-help" id="loginError"></span>
          </div>
          <label style="display: flex; align-items: center; gap: 8px; color: var(--text-2)">
            <input type="checkbox" name="remember" /> Remember me
          </label>
          <div class="auth-actions">
            <button class="btn btn-primary" type="submit">Log in</button>
            <a class="btn btn-ghost" href="/register">Create account</a>
            
          </div>
        </form>
      </div>
      <div class="auth-side">
        <h3>Study better together</h3>
        <ul>
          <li>Launch realtime rooms in seconds</li>
          <li>Sync whiteboards and chat instantly</li>
          <li>Crystal-clear audio and screen share</li>
          <li>Secure, private collaboration</li>
        </ul>
        <div class="auth-glow"></div>
      </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script defer src="runtime-config.js"></script>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
