services:
  - type: web
    name: study-collab-platform
    env: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: study-collab-platform
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: 1
      - key: MONGO_URI
        sync: false
      - key: MONGO_AUTO_INDEX
        value: false
      - key: MONGO_MAX_POOL_SIZE
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 120
      - key: MAX_FILE_SIZE_MB
        value: 20
      - key: ALLOWED_UPLOAD_MIME_TYPES
        value: image/png,image/jpeg,image/webp,image/gif,application/pdf,text/plain,text/markdown
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: study-collab
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302,stun:global.stun.twilio.com:3478
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: SOCKET_PING_TIMEOUT_MS
        value: 20000
      - key: SOCKET_PING_INTERVAL_MS
        value: 25000
      - key: SOCKET_MAX_HTTP_BUFFER_SIZE
        value: 1000000
      - key: LOG_LEVEL
        value: info
